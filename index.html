      property="og:description"
      content="統一企業團購網貼近員工日常生活脈動，懂得員工的購物期待，總是能提供物有所值的好商品，無須再去上網搜尋比價，是專屬員工的購物網站，取貨又方便，是個帶給員工便利生活的好平台。"

    <!-- <script src="/c9f019b30e.js" crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="/css/all.min.css" />
    <link rel="stylesheet" href="/css/sharp-regular.min.css" />
    <script src="/index.js"></script>
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] || '') + l.hash
          )
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div class="divClass" id="no-ie">
      團購網不支持此瀏覽器<br />

    <div class="divClass" id="count-down-timer"></div>
    <div id="app"></div>
